services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nisssi
      POSTGRES_PASSWORD: nisssi
      POSTGRES_DB: nisssicare
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nisssi -d nisssicare"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://nisssi:nisssi@db:5432/nisssicare
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
